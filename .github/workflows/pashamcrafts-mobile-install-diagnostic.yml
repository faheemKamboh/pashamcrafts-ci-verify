name: Diagnose PashamCrafts mobile install

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pashamcrafts-mobile-install-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Resolve public dependency installation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verifier configuration
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact mobile SHA
        id: request
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.PASHAMCRAFTS_READ_TOKEN }}
          STATUS_TOKEN: ${{ secrets.PASHAMCRAFTS_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          target_sha="$(jq -er '.target_sha' ci/requests/pashamcrafts-mobile.json)"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          [ -n "${READ_TOKEN}" ]
          [ -n "${STATUS_TOKEN}" ]
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact private mobile commit
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a
        with:
          repository: faheemKamboh/pashamcrafts-mobile
          ref: ${{ steps.request.outputs.target_sha }}
          token: ${{ secrets.PASHAMCRAFTS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Diagnose dependency resolution
        id: diagnose
        working-directory: app
        shell: bash
        run: |
          set +e
          npm install > "${RUNNER_TEMP}/npm-install.log" 2>&1
          status=$?

          slug() {
            printf '%s' "$1" \
              | sed -E 's#https?://[^[:space:]]+##g; s#(github_pat_|ghp_|ghs_)[A-Za-z0-9_]+#redacted#g; s/[^A-Za-z0-9@._+-]+/-/g; s/^-+|-+$//g' \
              | cut -c1-62
          }

          if [ "${status}" -eq 0 ]; then
            state=success
            summary="Dependency installation succeeded"
            code=success
            resolving=none
            found=none
            peer=none
          else
            state=failure
            code="$(sed -n -E 's/^npm (error|ERR!) code ([A-Z0-9_-]+).*$/\2/p' "${RUNNER_TEMP}/npm-install.log" | head -n 1)"
            resolving="$(sed -n -E 's/^npm (error|ERR!) While resolving: (.*)$/\2/p' "${RUNNER_TEMP}/npm-install.log" | head -n 1)"
            found="$(sed -n -E 's/^npm (error|ERR!) Found: (.*)$/\2/p' "${RUNNER_TEMP}/npm-install.log" | head -n 1)"
            peer="$(sed -n -E 's/^npm (error|ERR!) (peer(Optional)? .*)$/\2/p' "${RUNNER_TEMP}/npm-install.log" | head -n 1)"
            no_target="$(sed -n -E 's/^npm (error|ERR!) (No matching version found for .*)$/\2/p' "${RUNNER_TEMP}/npm-install.log" | head -n 1)"

            [ -n "${code}" ] || code=unknown
            [ -n "${resolving}" ] || resolving=unknown
            [ -n "${found}" ] || found=unknown
            [ -n "${peer}" ] || peer="${no_target:-unknown}"
            summary="npm ${code}: ${peer}"
          fi

          {
            echo "state=${state}"
            echo "summary=$(printf '%s' "${summary}" | cut -c1-120)"
            echo "code=$(slug "${code}")"
            echo "resolving=$(slug "${resolving}")"
            echo "found=$(slug "${found}")"
            echo "peer=$(slug "${peer}")"
          } >> "${GITHUB_OUTPUT}"

          if [ "${status}" -ne 0 ]; then
            echo "Dependency installation failed. Sanitized npm resolver output follows:"
            grep -E '^(npm (error|ERR!) )?(code |ERESOLVE|E[[:upper:]]+|While resolving:|Found:|Could not resolve dependency:|Conflicting peer dependency:|No matching version found|notarget|peer |Fix the upstream dependency conflict)' "${RUNNER_TEMP}/npm-install.log" \
              | sed -E 's#https?://[^[:space:]]+#[url]#g; s#(github_pat_|ghp_|ghs_)[A-Za-z0-9_]+#[redacted]#g' \
              | head -n 60
          fi

          exit 0

      - name: Publish sanitized diagnosis
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          STATUS_TOKEN: ${{ secrets.PASHAMCRAFTS_STATUS_TOKEN }}
          STATE: ${{ steps.diagnose.outputs.state }}
          SUMMARY: ${{ steps.diagnose.outputs.summary }}
          CODE: ${{ steps.diagnose.outputs.code }}
          RESOLVING: ${{ steps.diagnose.outputs.resolving }}
          FOUND: ${{ steps.diagnose.outputs.found }}
          PEER: ${{ steps.diagnose.outputs.peer }}
        run: |
          set -euo pipefail
          target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          publish() {
            local context="$1"
            local description="$2"
            payload="$(jq -n \
              --arg state "${STATE}" \
              --arg context "${context}" \
              --arg description "${description}" \
              --arg target_url "${target_url}" \
              '{state: $state, context: $context, description: $description, target_url: $target_url}')"
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer ${STATUS_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/faheemKamboh/pashamcrafts-mobile/statuses/${TARGET_SHA}" \
              --data "${payload}" > /dev/null
          }

          publish "pashamcrafts-mobile/install-detail" "${SUMMARY}"
          publish "pashamcrafts-mobile/install-code/${CODE}" "npm resolver code"
          publish "pashamcrafts-mobile/install-resolving/${RESOLVING}" "package being resolved"
          publish "pashamcrafts-mobile/install-found/${FOUND}" "resolved package version"
          publish "pashamcrafts-mobile/install-peer/${PEER}" "conflicting peer requirement"

      - name: Enforce diagnosis result
        shell: bash
        run: test "${{ steps.diagnose.outputs.state }}" = success
